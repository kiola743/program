[project]
name = "quant"
version = "0.1.0"
description = "한국 코인/주식 퀀트 자동매매 시스템 (업비트 우선, KIS 확장 가능)"
requires-python = ">=3.11"
dependencies = [
    "pyupbit>=0.2.33",
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quant = "quant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
